name: Release

on:
  workflow_run:
    workflows: ["Build"]
    branches: [main]
    types: [completed]

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # workflow_run always checks out the DEFAULT branch unless pinned —
          # correct today only because main is the default. This checkout
          # carries a write-scoped RELEASE_TOKEN feeding semantic-release, so
          # pin explicitly. Same bug class as seed-staging.yml (fixed 2026-07-05).
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Prisma Client
        uses: actions/cache@v6
        id: prisma-cache-release
        with:
          path: src/generated/prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('prisma/schema.prisma', 'pnpm-lock.yaml') }}

      - name: Generate Prisma client
        if: steps.prisma-cache-release.outputs.cache-hit != 'true'
        run: npx prisma generate --schema=prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build

      - name: Disarm local pre-push hook for CI
        # `pnpm install` arms core.hooksPath=.githooks (see the `prepare` script),
        # which re-runs lint+typecheck on `@semantic-release/git`'s push to main.
        # That hook is a developer fast-fail; CI is authoritative for the
        # automated release path, so point hooksPath away from it here.
        run: git config core.hooksPath /dev/null

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: npx semantic-release

      - name: Merge main back into staging
        # After a release, main carries the release commit (version bump + changelog)
        # that staging lacks, which makes every promotion PR "behind main". Merge it
        # back so the next promotion needs no manual "Update branch". [skip ci] so the
        # push triggers no staging build or reseed; the version bump deploys with the
        # next real staging change. Never --force; a merge conflict fails this step
        # (git's default behaviour) and is resolved by hand.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main staging
          if git merge-base --is-ancestor origin/main origin/staging; then
            echo "staging already contains main; nothing to merge"
            exit 0
          fi
          git checkout -B staging origin/staging
          git merge --no-ff origin/main -m "chore: merge main into staging after release [skip ci]"
          git push origin staging
